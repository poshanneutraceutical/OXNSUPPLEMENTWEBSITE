<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/oxn-logo.png" />

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>
        OXN Supplement | Premium Sports Nutrition & Supplements
    </title>

    <!-- SEO Description -->
    <meta
            name="description"
            content="OXN Supplement premium sports nutrition and whey protein. Explore the OXN Whey Protein flavour collection."
    />

    <!-- Search Engine Instructions -->
    <meta
            name="robots"
            content="index, follow"
    />

    <!-- Canonical URL -->
    <link
            rel="canonical"
            href="https://YOUR-OXN-DOMAIN/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
            property="og:type"
            content="website"
    />

    <meta
            property="og:url"
            content="https://YOUR-OXN-DOMAIN/"
    />

    <meta
            property="og:title"
            content="OXN Supplement | Premium Sports Nutrition & Supplements"
    />

    <meta
            property="og:description"
            content="Premium whey protein and sports nutrition from OXN Supplement."
    />

    <meta
            property="og:image"
            content="https://YOUR-OXN-DOMAIN/oxn-logo.png"
    />

    <!-- Twitter / X -->
    <meta
            name="twitter:card"
            content="summary_large_image"
    />

    <meta
            name="twitter:title"
            content="OXN Supplement | Premium Sports Nutrition & Supplements"
    />

    <meta
            name="twitter:description"
            content="Premium whey protein and sports nutrition from OXN Supplement."
    />

    <meta
            name="twitter:image"
            content="https://YOUR-OXN-DOMAIN/oxn-logo.png"
    />
</head>

<div id="root"></div>

<script
        type="module"
